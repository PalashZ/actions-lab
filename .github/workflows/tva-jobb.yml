name: Två jobb

on: workflow_dispatch

jobs:
  forsta:
    runs-on: ubuntu-latest
    steps:
      - name: Skapa en fil
        run: |
          echo "resultatet av mitt hårda arbete" > resultat.txt
          ls -la

      - name: Spara filen
        uses: actions/upload-artifact@v4
        with:
          name: resultat
          path: resultat.txt

  andra:
    runs-on: ubuntu-latest
    needs: forsta
    steps:
      - name: Hämta filen
        uses: actions/download-artifact@v4
        with:
          name: resultat

      - name: Leta efter filen
        run: |
          ls -la
          cat resultat.txt
